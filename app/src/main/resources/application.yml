chat-machinist:
  visualize: true
  applicationName: "Money Manager AI"
  persistence:
    type: mongodb
  bot:
    name: ${BOT_NAME}
    token: ${BOT_TOKEN}
  alert:
    telegramChatId: ${ALERT_CHAT_ID:#{null}}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash-lite

ai:
  rate-limit:
    daily-requests-per-user: 10
    daily-requests-per-user-paid: 100

category:
  max-per-type-free: 10
  max-per-type-paid: 1000

history:
  max-days-back-free: 30

group:
  max-owned-shared-free: 3

notification:
  max-active-free: 3

notifications:
  alert-chat-id: ${ALERT_CHAT_ID:#{null}}

admin:
  telegram-user-ids: ${ADMIN_TELEGRAM_USER_IDS:}

telegram:
  file:
    max-voice-duration-seconds: 180 # 3 минуты
    max-file-size-bytes: 2097152 # 2 MB (2 * 1024 * 1024)
    api-url: "https://api.telegram.org/file/bot"

debug: false

server:
  port: ${SERVER_PORT:8080}

spring:
  mongodb:
    database: moneyManagerBot
    host: ${MONGO_HOST:localhost}
    username: ${MONGO_USERNAME}
    password: ${MONGO_PASSWORD}
    port: 27019
  data:
    mongodb:
      auto-index-creation: true
  main:
    banner-mode: off
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false